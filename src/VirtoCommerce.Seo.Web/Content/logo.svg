<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="SEO">
  <title>SEO</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#B79DFB"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#3A1D7A" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g transform="translate(64,64)" filter="url(#lift)">
    <!-- Handle -->
    <line x1="14" y1="14" x2="40" y2="40" stroke="#5A38C0" stroke-width="13" stroke-linecap="round"/>
    <!-- Lens -->
    <circle cx="-6" cy="-6" r="29" fill="#ffffff" stroke="#5A38C0" stroke-width="6"/>
    <!-- Ranking trend -->
    <rect x="-20" y="0" width="7" height="10" rx="2" fill="#5FC8F5"/>
    <rect x="-9" y="-5" width="7" height="15" rx="2" fill="#FFC24D"/>
    <polyline points="-20,2 -6,-8 8,-18" fill="none" stroke="#2FA85A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="2,-19 11,-21 9,-12" fill="#2FA85A"/>
  </g>
</svg>
